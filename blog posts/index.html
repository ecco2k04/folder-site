      if (node.type === 'other') {
        window.open(node.href, '_blank', 'noopener');
        return;
      }
      const existing = [...windows].find(w => w.kind === 'file' && w.node === node);
      existing ? bringBack(existing) : openFile(node);
    }

    // reuse a finder window already showing `folder`, like macOS does
    function showFolder(folder) {
      const existing = [...windows].find(w => w.kind === 'finder' && w.current() === folder);
      existing ? bringBack(existing) : openFinder(folder);
    }

    function openFile(node) {
      const maxW = Math.min(window.innerWidth - 40, 960);
      const maxH = window.innerHeight - 120; // keep clear of the dock
      const type = node.type;
      let body;
      let w;
      let h;

      if (type === 'image' || type === 'video') {
        body = el(type === 'image' ? 'img' : 'video');
        body.src = node.href;
        if (type === 'image') {
          body.alt = node.name;
          body.draggable = false;
        } else {
          body.controls = true;
          body.autoplay = true;
          body.playsInline = true;
        }
        const iw = node.w || 800;
        const ih = node.h || 600;
        const scale = Math.min(1, (maxW * .8) / iw, (maxH - TITLEBAR) / ih);
        w = Math.max(220, Math.round(iw * scale));
        h = Math.round(ih * scale) + TITLEBAR;
      } else if (type === 'audio') {
        body = el('audio');
        body.src = node.href;
        body.controls = true;
        body.autoplay = true;
        [w, h] = [380, 110];
      } else if (type === 'pdf') {
        body = el('iframe');
        body.src = node.href;
        body.title = node.name;
        [w, h] = [Math.min(680, maxW), Math.min(820, maxH)];
      } else {
        body = document.createRange().createContextualFragment(node.content || '');
        [w, h] = [Math.min(560, maxW), Math.min(620, maxH)];
      }

      const entry = { kind: 'file', node, tile: () => ({ node }) };
      const win = makeWindow(`window-${type}`, w, h,
        `<div class="titlebar drag-region">${LIGHTS}<div class="title"></div></div><div class="content"></div>`, entry);
      win.setAttribute('aria-label', node.name);
      win.querySelector('.title').textContent = node.name;
      win.querySelector('.content').append(body);
    }

    /* ---------- finder windows ---------- */
    function openFinder(folder) {
      const entry = {
        kind: 'finder',
        history: [folder],
        at: 0,
        view: 'icons',
        query: '',
        current: () => entry.history[entry.at],
        tile: () => ({ node: entry.current() }),
      };
      const w = Math.min(780, window.innerWidth - 40);
      const h = Math.min(480, window.innerHeight - 120);
      const win = makeWindow('window-finder', w, h,
        `<aside class="finder-sidebar drag-region">${LIGHTS}<div class="sb-items"></div></aside>` +
        '<div class="finder-main">' +
        '<div class="finder-toolbar drag-region">' +
        `<div class="tb-group"><button class="tb-btn back" type="button" aria-label="Back">${SVG.back}</button>` +
        `<button class="tb-btn forward" type="button" aria-label="Forward">${SVG.forward}</button></div>` +
        '<div class="finder-title"></div>' +
        `<div class="tb-group"><button class="tb-btn view-icons" type="button" aria-label="Icon view">${SVG.icons}</button>` +
        `<button class="tb-btn view-list" type="button" aria-label="List view">${SVG.list}</button></div>` +
        `<label class="tb-search">${SVG.search}<input type="search" placeholder="Search" aria-label="Search"></label>` +
        '</div>' +
        '<div class="trash-bar" hidden><span>Trash</span><button class="trash-empty" type="button">Empty</button></div>' +
        '<div class="finder-content"></div>' +
        '<div class="finder-pathbar"></div>' +
        '</div>', entry);

      win.querySelector('.back').addEventListener('click', () => go(entry, -1));
      win.querySelector('.forward').addEventListener('click', () => go(entry, 1));
      win.querySelector('.view-icons').addEventListener('click', () => { entry.view = 'icons'; renderFinder(entry); });
      win.querySelector('.view-list').addEventListener('click', () => { entry.view = 'list'; renderFinder(entry); });
      win.querySelector('.trash-empty').addEventListener('click', emptyTrash);
      const search = win.querySelector('input');
      search.addEventListener('input', () => { entry.query = search.value.trim().toLowerCase(); renderFinder(entry); });
      // clicking empty space in the folder clears the selection
      win.querySelector('.finder-content').addEventListener('pointerdown', e => {
        if (!e.target.closest('.file, .row')) {
          select(null);
        }
      });
      renderFinder(entry);
    }

    function renderSidebar(entry) {
      const items = entry.win.querySelector('.sb-items');
      const folder = entry.current();
      items.replaceChildren();
      const section = title => {
        const heading = el('div', 'sb-section');
        heading.textContent = title;
        items.append(heading);
      };
      const item = (svg, node) => {
        const button = el('button', 'sb-item', svg + '<span></span>');
        button.type = 'button';
        button.querySelector('span').textContent = node.name;
        button.classList.toggle('current', node === folder);
        button.node = node; // also a drop target
        button.addEventListener('click', () => navigate(entry, node));
        items.append(button);
      };
      section('Favorites');
      item(SVG.desktop, ROOT);
      ROOT.children.filter(n => n.type === 'directory').forEach(n => item(SVG.folder, n));
      section('Locations');
      item(SVG.trash, TRASH);
      section('Tags');
      TAGS.forEach(([name, color]) => {
        items.append(el('div', 'sb-item', `<span class="sb-tag" style="background:${color}"></span><span>${name}</span>`));
      });
    }

    function navigate(entry, folder) {
      if (folder === entry.current()) {
        return;
      }
      entry.history = entry.history.slice(0, entry.at + 1);
      entry.history.push(folder);
      entry.at++;
      entry.query = '';
      entry.win.querySelector('input').value = '';
      renderFinder(entry);
    }

    function go(entry, delta) {
      const at = entry.at + delta;
      if (at >= 0 && at < entry.history.length) {
        entry.at = at;
        renderFinder(entry);
      }
    }

    function renderFinder(entry) {
      const { win } = entry;
      const folder = entry.current();
      const items = folder.children.filter(n => n.name.toLowerCase().includes(entry.query));
      const openItem = node => node.type === 'directory' ? navigate(entry, node) : open(node);
      const hadSelection = selected && win.contains(selected) ? selected.node : null;

      win.setAttribute('aria-label', folder.name);
      win.querySelector('.finder-title').textContent = folder.name;
      win.querySelector('.back').disabled = entry.at === 0;
      win.querySelector('.forward').disabled = entry.at === entry.history.length - 1;
      win.querySelector('.view-icons').classList.toggle('active', entry.view === 'icons');
      win.querySelector('.view-list').classList.toggle('active', entry.view === 'list');
      win.querySelector('.trash-bar').hidden = folder !== TRASH;
      win.querySelector('.trash-empty').disabled = TRASH.children.length === 0;
      renderSidebar(entry);

      const content = win.querySelector('.finder-content');
      content.replaceChildren();
      if (items.length === 0) {
        const empty = el('div', 'finder-empty');
        empty.textContent = entry.query ? 'No Results' : '';
        content.append(empty);
      } else if (entry.view === 'icons') {
        // arranged by hand on the mac: keep that layout. search results use a grid
        const natural = !entry.query && isArranged(folder);
        const grid = el('div', natural ? 'finder-grid finder-natural' : 'finder-grid');
        items.forEach(node => {
          const icon = iconFor(node);
          if (natural) {
            icon.style.left = node.x + 'px';
            icon.style.top = node.y + 'px';
          }
          wireIcon(icon, () => openItem(node));
          makeDraggable(icon, node);
          grid.append(icon);
        });
        if (natural) {
          grid.style.width = Math.max(...items.map(n => n.x)) + 120 + 'px';
          grid.style.height = Math.max(...items.map(n => n.y)) + 110 + 'px';
        }
        content.append(grid);
      } else {
        const table = el('table', 'finder-list', '<thead><tr><th>Name</th><th>Date Modified</th><th>Size</th><th>Kind</th></tr></thead>');
        const tbody = el('tbody');
        items.forEach(node => {
          const row = el('tr', 'row', '<td><span class="row-name"><span></span></span></td><td></td><td></td><td></td>');
          row.tabIndex = 0;
          row.node = node;
          const cells = row.children;
          cells[0].firstChild.prepend(miniIcon(node));
          cells[0].querySelector('.row-name > span:last-child').textContent = node.name;
          cells[1].textContent = formatDate(node.modified);
          cells[2].textContent = node.type === 'directory' ? '--' : formatSize(node.bytes);
          cells[3].textContent = kindOf(node);
          wireIcon(row, () => openItem(node));
          makeDraggable(row, node);
          tbody.append(row);
        });
        table.append(tbody);
        content.append(table);
      }
      // keep the selection across re-renders
      if (hadSelection) {
        const again = [...content.querySelectorAll('.file, .row')].find(n => n.node === hadSelection);
        select(again || null);
      }

      // path bar: double-click any folder in the chain to go there
      const pathbar = win.querySelector('.finder-pathbar');
      pathbar.replaceChildren();
      pathTo(folder).forEach((node, i) => {
        if (i > 0) {
          pathbar.append('›');
        }
        const crumb = el('button', 'crumb');
        crumb.type = 'button';
        crumb.append(miniIcon(node), node.name);
        crumb.addEventListener('dblclick', () => navigate(entry, node));
        pathbar.append(crumb);
      });
      const count = el('span', 'finder-count');
      const total = folder.children.length;
      count.textContent = `${total} item${total === 1 ? '' : 's'}`;
      pathbar.append(count);
    }

    function emptyTrash() {
      TRASH.children.forEach(node => parentOf.delete(node));
      TRASH.children = [];
      windows.forEach(entry => {
        if (entry.kind === 'file' && pathTo(entry.node)[0] !== ROOT) {
          close(entry);
        }
      });
      refreshAll();
    }

    // redraw everything that shows the folder tree after a move
    function refreshAll() {
      syncDesktop();
      windows.forEach(entry => {
        if (entry.kind === 'finder') {
          // a folder emptied out of the trash is gone for good
          entry.history = entry.history.filter(f => [ROOT, TRASH].includes(pathTo(f)[0]));
          if (!entry.history.length) {
            entry.history = [TRASH];
          }
          entry.at = Math.min(entry.at, entry.history.length - 1);
          renderFinder(entry);
        }
      });
      trash.classList.toggle('full', TRASH.children.length > 0);
    }

    /* ================= drag and drop ================= */
    // icons can be dragged around the desktop, into folders and finder windows,
    // or into the trash. nothing is saved: a reload puts everything back.
    let dropTarget = null;

    function makeDraggable(source, node) {
      source.addEventListener('pointerdown', e => {
        if (e.button !== 0 || lastPointer === 'touch') {
          return;
        }
        const startX = e.clientX;
        const startY = e.clientY;
        const rect = source.getBoundingClientRect();
        // list rows drag a full icon, held by its middle
        const fromIcon = source.classList.contains('file');
        const grabX = fromIcon ? startX - rect.left : 48;
        const grabY = fromIcon ? startY - rect.top : 36;
        let ghost = null;

        const move = ev => {
          if (!ghost) {
            if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < 5) {
              return;
            }
            ghost = iconFor(node);
            ghost.classList.add('drag-ghost');
            document.body.append(ghost);
            select(source);
            source.classList.add('drag-source');
            document.body.classList.add('dragging');
          }
          ghost.style.transform = `translate(${ev.clientX - grabX}px, ${ev.clientY - grabY}px)`;
          setDropTarget(findDropTarget(ev.clientX, ev.clientY, node));
        };

        const end = ev => {
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', end);
          document.removeEventListener('pointercancel', end);
          if (!ghost) {
            return;
          }
          const target = ev.type === 'pointerup' ? findDropTarget(ev.clientX, ev.clientY, node) : null;
          setDropTarget(null);
          source.classList.remove('drag-source');
          document.body.classList.remove('dragging');
          swallowNextClick();
          drop(node, target, ghost, ev.clientX - grabX, ev.clientY - grabY);
        };

        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', end);
        document.addEventListener('pointercancel', end);
      });
    }

    // the pointerup that ends a drag shouldn't also count as a click
    function swallowNextClick() {
      const swallow = e => {
        e.stopPropagation();
        e.preventDefault();
      };
      window.addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => window.removeEventListener('click', swallow, { capture: true }), 0);
    }

    // what's under the pointer that `node` could be dropped into
    function findDropTarget(x, y, node) {
      const hit = document.elementFromPoint(x, y);
      if (!hit) {
        return null;
      }
      const into = folder => folder && folder !== parentOf.get(node) && !contains(node, folder);

      if (hit.closest('.dock-trash')) {
        return isTrashed(node) && parentOf.get(node) === TRASH ? null : { kind: 'folder', folder: TRASH, el: trash };
      }
      if (hit.closest('.dock, .widget')) {
        return null;
      }
      // a folder icon, list row, or sidebar entry
      const item = hit.closest('.file, .row, .sb-item');
      if (item && item.node && item.node.type === 'directory' && item.node !== node) {
        return into(item.node) ? { kind: 'folder', folder: item.node, el: item } : null;
      }
      // the open folder of a finder window
      const win = hit.closest('.window');
      if (win) {
        const folder = win.entry.kind === 'finder' ? win.entry.current() : null;
        // hand-arranged icon view: drops land exactly where you let go
        const grid = win.querySelector('.finder-natural');
        if (folder && folder === parentOf.get(node)) {
          return grid ? { kind: 'reposition', folder, grid } : null;
        }
        return into(folder) ? { kind: 'folder', folder, el: win.querySelector('.finder-content'), grid } : null;
      }
      return { kind: 'desktop' };
    }

    function setDropTarget(target) {
      if (dropTarget?.el === target?.el) {
        return;
      }
      dropTarget?.el?.classList.remove('drop-target');
      target?.el?.classList.add('drop-target');
      dropTarget = target;
    }

    function drop(node, target, ghost, x, y) {
      if (!target) {
        // nowhere to go: fade the icon back out
        ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150 }).onfinish = () => ghost.remove();
        return;
      }
      if (target.kind === 'desktop') {
        ghost.remove();
        if (parentOf.get(node) === ROOT) {
          placeOnDesktop(node, x, y);
        } else {
          moveNode(node, ROOT);
          pendingDesktopSpot.set(node, [x, y]);
          refreshAll();
        }
        return;
      }
      // the drop point inside a hand-arranged finder window
      let at;
      if (target.grid) {
        const rect = target.grid.getBoundingClientRect();
        at = [Math.max(0, Math.round(x - rect.left)), Math.max(0, Math.round(y - rect.top))];
      }
      if (target.kind === 'reposition') {
        ghost.remove();
        [node.x, node.y] = at;
        refreshAll();
        return;
      }
      if (at) {
        // it lands right there, so no shrinking animation
        ghost.remove();
        moveNode(node, target.folder, at);
        refreshAll();
        return;
      }
      // into a folder (or the trash): shrink the icon into where it went
      const to = target.el.getBoundingClientRect();
      const from = ghost.getBoundingClientRect();
      ghost.animate([
        { transform: ghost.style.transform, opacity: 1 },
        { transform: `translate(${to.left + to.width / 2 - from.width / 2}px, ${to.top + to.height / 2 - from.height / 2}px) scale(.2)`, opacity: 0 },
      ], { duration: 220, easing: 'ease-in' }).onfinish = () => ghost.remove();
      moveNode(node, target.folder);
      // fallback in case the animation never finishes (background tabs)
      setTimeout(() => ghost.remove(), 400);
      refreshAll();
    }

    /* ================= messages: a public guestbook ================= */
    // with a supabase project configured in site.config.json, everyone sees
    // everyone's messages. without one, messages stay in this browser only.
    const GUESTBOOK = CONFIG.guestbook || {};
    const GUESTBOOK_LIVE = Boolean(GUESTBOOK.supabaseUrl && GUESTBOOK.supabaseKey);
    const GUESTBOOK_POLL_MS = 15000;
    const GUESTBOOK_COOLDOWN_MS = 10000;
    const MINE_KEY = 'guestbook-mine';
    const NAME_KEY = 'guestbook-name';
    const LOCAL_KEY = 'guestbook-local';
    const MESSAGES_ICON = dock.querySelector('.dock-messages .dock-icon').innerHTML;

    const readStore = (key, fallback) => {
      try {
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
      } catch {
        return fallback;
      }
    };
    const writeStore = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch { }
    };

    function supabaseHeaders() {
      const headers = { apikey: GUESTBOOK.supabaseKey };
      // legacy anon keys are JWTs and also go in Authorization
      if (GUESTBOOK.supabaseKey.startsWith('eyJ')) {
        headers.Authorization = 'Bearer ' + GUESTBOOK.supabaseKey;
      }
      return headers;
    }

    async function fetchGuestbook() {
      if (!GUESTBOOK_LIVE) {
        return readStore(LOCAL_KEY, []);
      }
      const url = `${GUESTBOOK.supabaseUrl}/rest/v1/messages?select=id,name,body,created_at&order=created_at.desc&limit=300`;
      const res = await fetch(url, { headers: supabaseHeaders() });
      if (!res.ok) {
        throw new Error('guestbook fetch failed: ' + res.status);
      }
      return (await res.json()).reverse();
    }

    async function postGuestbook(name, body) {
      if (!GUESTBOOK_LIVE) {
        const message = { id: 'local-' + Date.now(), name, body, created_at: new Date().toISOString() };
        writeStore(LOCAL_KEY, [...readStore(LOCAL_KEY, []), message]);
        return message;
      }
      const res = await fetch(`${GUESTBOOK.supabaseUrl}/rest/v1/messages`, {
        method: 'POST',
        headers: { ...supabaseHeaders(), 'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: JSON.stringify({ name, body }),
      });
      if (!res.ok) {
        throw new Error('guestbook post failed: ' + res.status);
      }
      return (await res.json())[0];
    }

    // "Today 9:41 AM", "Yesterday 9:41 AM", "Mon, Sep 29 at 9:41 AM"
    function messageStamp(iso) {
      const date = new Date(iso);
      const time = date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(iso).setHours(0, 0, 0, 0)) / 864e5);
      if (days === 0) return `Today ${time}`;
      if (days === 1) return `Yesterday ${time}`;
      const day = date.toLocaleDateString(undefined, {
        weekday: 'short', month: 'short', day: 'numeric', year: days > 300 ? 'numeric' : undefined,
      });
      return `${day} at ${time}`;
    }

    const initials = name => name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';

    function avatar(name, className = 'avatar') {
      const circle = el('span', className);
      circle.textContent = initials(name);
      return circle;
    }

    function openMessages() {
      const existing = [...windows].find(w => w.kind === 'messages');
      if (existing) {
        bringBack(existing);
        return;
      }
      const entry = {
        kind: 'messages',
        messages: [],
        failed: [],
        query: '',
        tile: () => ({ node: { name: 'Messages' }, appIcon: MESSAGES_ICON }),
      };
      const w = Math.min(760, window.innerWidth - 40);
      const h = Math.min(540, window.innerHeight - 110);
      const win = makeWindow('window-messages', w, h,
        `<aside class="msg-sidebar drag-region">${LIGHTS}` +
        `<label class="tb-search msg-search">${SVG.search}<input type="search" placeholder="Search" aria-label="Search messages"></label>` +
        '<div class="msg-convo selected"><span class="avatar avatar-group"></span>' +
        '<div class="convo-text"><div class="convo-top"><span class="convo-name">Guestbook</span><span class="convo-time"></span></div>' +
        '<div class="convo-preview"></div></div></div>' +
        '</aside>' +
        '<div class="msg-main">' +
        '<div class="msg-header drag-region"><span class="avatar avatar-group"></span><div class="msg-header-name">Guestbook</div>' +
        `<div class="msg-header-sub">${GUESTBOOK_LIVE ? 'Leave a note for everyone who visits' : 'Messages are only saved in this browser for now'}</div></div>` +
        '<div class="msg-list" aria-live="polite"></div>' +
        '<form class="msg-compose">' +
        '<input class="msg-name" type="text" placeholder="Your name" maxlength="40" aria-label="Your name" autocomplete="nickname">' +
        '<div class="msg-field"><input class="msg-input" type="text" placeholder="Message" maxlength="500" aria-label="Message" autocomplete="off">' +
        `<button class="msg-send" type="submit" aria-label="Send" disabled>${SVG.send}</button></div>` +
        // bots fill every field; people never see this one
        '<input class="msg-hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '</form>' +
        '</div>', entry);
      win.setAttribute('aria-label', 'Messages');

      const form = win.querySelector('.msg-compose');
      const nameInput = win.querySelector('.msg-name');
      const input = win.querySelector('.msg-input');
      const send = win.querySelector('.msg-send');
      const search = win.querySelector('.msg-search input');
      let lastSent = 0;

      nameInput.value = readStore(NAME_KEY, '');
      const updateSend = () => {
        send.disabled = !input.value.trim();
      };
      input.addEventListener('input', updateSend);
      nameInput.addEventListener('change', () => writeStore(NAME_KEY, nameInput.value.trim()));
      search.addEventListener('input', () => {
        entry.query = search.value.trim().toLowerCase();
        renderMessages(entry);
      });

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const name = nameInput.value.trim();
        const body = input.value.trim();
        if (!body || win.querySelector('.msg-hp').value) {
          return;
        }
        if (!name) {
          nameInput.classList.add('needs-name');
          nameInput.focus();
          setTimeout(() => nameInput.classList.remove('needs-name'), 600);
          return;
        }
        if (Date.now() - lastSent < GUESTBOOK_COOLDOWN_MS) {
          return;
        }
        lastSent = Date.now();
        writeStore(NAME_KEY, name);
        input.value = '';
        updateSend();

        // show it right away, like iMessage, then confirm or mark it failed
        const pending = { id: 'pending-' + Date.now(), name, body, created_at: new Date().toISOString(), pending: true };
        entry.messages.push(pending);
        renderMessages(entry, true);
        try {
          const saved = await postGuestbook(name, body);
          writeStore(MINE_KEY, [...readStore(MINE_KEY, []), saved.id]);
          entry.messages[entry.messages.indexOf(pending)] = saved;
        } catch (err) {
          console.error(err);
          pending.failed = true;
        }
        pending.pending = false;
        renderMessages(entry);
      });

      const load = async () => {
        try {
          const fresh = await fetchGuestbook();
          // keep messages that are still sending or failed
          entry.messages = [...fresh, ...entry.messages.filter(m => m.pending || m.failed)];
          renderMessages(entry, true);
        } catch (err) {
          console.error(err);
          if (!entry.messages.length) {
            win.querySelector('.msg-list').replaceChildren(el('div', 'msg-status', 'Couldn’t load messages. Try again later.'));
          }
        }
      };
      load();
      const poll = GUESTBOOK_LIVE ? setInterval(() => !entry.mini && load(), GUESTBOOK_POLL_MS) : null;
      entry.onClose = () => clearInterval(poll);
      input.focus();
    }

    function renderMessages(entry, scrollToEnd = false) {
      const list = entry.win.querySelector('.msg-list');
      const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
      const mine = new Set(readStore(MINE_KEY, []));
      const shown = entry.messages.filter(m => !entry.query || (m.name + ' ' + m.body).toLowerCase().includes(entry.query));
      const lastMine = [...shown].reverse().find(m => mine.has(m.id) || m.pending || m.failed);

      list.replaceChildren();
      if (!shown.length) {
        list.append(el('div', 'msg-status', entry.query ? 'No Results' : 'No messages yet. Say hi!'));
      }
      shown.forEach((message, i) => {
        const prev = shown[i - 1];
        const next = shown[i + 1];
        const time = new Date(message.created_at).getTime();
        // a centered timestamp whenever an hour or more has passed
        if (!prev || time - new Date(prev.created_at).getTime() > 36e5) {
          const stamp = el('div', 'msg-stamp');
          stamp.textContent = messageStamp(message.created_at);
          list.append(stamp);
        }
        const isMine = mine.has(message.id) || message.pending || message.failed;
        const sameSender = (a, b) => a && b && a.name === b.name && Math.abs(new Date(a.created_at) - new Date(b.created_at)) < 5 * 6e4;
        const first = !sameSender(prev, message);
        const last = !sameSender(message, next);

        const row = el('div', 'msg-row ' + (isMine ? 'mine' : 'theirs') + (last ? ' last' : ''));
        if (!isMine) {
          row.append(last ? avatar(message.name) : el('span', 'avatar avatar-space'));
        }
        const stack = el('div', 'msg-stack');
        if (!isMine && first) {
          const sender = el('div', 'msg-sender');
          sender.textContent = message.name;
          stack.append(sender);
        }
        const bubble = el('div', 'bubble');
        bubble.textContent = message.body;
        bubble.title = `${message.name} · ${new Date(message.created_at).toLocaleString()}`;
        stack.append(bubble);
        if (message === lastMine) {
          const status = el('div', 'msg-receipt' + (message.failed ? ' failed' : ''));
          status.textContent = message.failed ? 'Not Delivered' : message.pending ? 'Sending…' : 'Delivered';
          stack.append(status);
        }
        row.append(stack);
        list.append(row);
      });

      const latest = entry.messages.at(-1);
      entry.win.querySelector('.convo-preview').textContent = latest ? `${latest.name}: ${latest.body}` : 'No messages yet';
      entry.win.querySelector('.convo-time').textContent = latest ? messageStamp(latest.created_at).replace(/ at .*| \d.*/, '') : '';
      if (scrollToEnd || nearBottom) {
        list.scrollTop = list.scrollHeight;
      }
    }

    /* ================= weather widget ================= */
    // live conditions from open-meteo.com (free, no key needed)
    const WEATHER_REFRESH_MS = 15 * 60 * 1000;

    // WMO weather codes -> [day label, night label, day emoji, night emoji, look]
    function describeWeather(code) {
      if (code === 0) return ['Sunny', 'Clear', '☀️', '🌙', 'clear'];
      if (code === 1) return ['Mostly Sunny', 'Mostly Clear', '🌤️', '🌙', 'clear'];
      if (code === 2) return ['Partly Cloudy', 'Partly Cloudy', '⛅️', '☁️', 'cloudy'];
      if (code === 3) return ['Cloudy', 'Cloudy', '☁️', '☁️', 'cloudy'];
      if (code === 45 || code === 48) return ['Foggy', 'Foggy', '🌫️', '🌫️', 'cloudy'];
      if (code >= 51 && code <= 57) return ['Drizzle', 'Drizzle', '🌦️', '🌧️', 'rain'];
      if (code >= 61 && code <= 67) return [code === 65 ? 'Heavy Rain' : 'Rain', code === 65 ? 'Heavy Rain' : 'Rain', '🌧️', '🌧️', 'rain'];
      if (code >= 71 && code <= 77) return ['Snow', 'Snow', '🌨️', '🌨️', 'snow'];
      if (code >= 80 && code <= 82) return ['Showers', 'Showers', '🌦️', '🌧️', 'rain'];
      if (code === 85 || code === 86) return ['Snow Showers', 'Snow Showers', '🌨️', '🌨️', 'snow'];
      if (code >= 95) return ['Thunderstorms', 'Thunderstorms', '⛈️', '⛈️', 'storm'];
      return ['--', '--', '', '', 'cloudy'];
    }

    async function updateWeather() {
      const widget = document.querySelector('.weather');
      const place = CONFIG.weather;
      if (!widget || !place) {
        return;
      }
      widget.querySelector('.weather-city span').textContent = place.city;
      widget.hidden = false;
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?current=temperature_2m,weather_code,is_day&temperature_unit=fahrenheit' +
          `&latitude=${place.latitude}&longitude=${place.longitude}&timezone=${encodeURIComponent(place.timezone)}`;
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error('weather fetch failed: ' + res.status);
        }
        const { current } = await res.json();
        const day = current.is_day === 1;
        const [dayLabel, nightLabel, dayIcon, nightIcon, look] = describeWeather(current.weather_code);
        widget.querySelector('.weather-temp').textContent = Math.round(current.temperature_2m) + '°';
        widget.querySelector('.weather-icon').textContent = day ? dayIcon : nightIcon;
        widget.querySelector('.weather-text').textContent = day ? dayLabel : nightLabel;
        widget.dataset.look = day ? look : 'night';
      } catch (err) {
        console.error(err);
        widget.querySelector('.weather-text').textContent = 'Weather unavailable';
      }
    }

    /* ================= menu bar ================= */
    const menubar = document.querySelector('.menubar');
    const appTitle = menubar.querySelector('.menu-app');
    const clock = menubar.querySelector('.menu-clock');
    const ABOUT = CONFIG.about || {};
    const CLOUD_ICON = menubar.querySelector('.menu-logo').innerHTML;
    let openMenu = null; // { title, dropdown }

    // the frontmost window that isn't minimized
    const activeEntry = () => [...windows].find(w => !w.mini && !w.win.classList.contains('inactive'));

    // which "app" the front window belongs to, like the bold name in the real menu bar
    function appNameFor(entry) {
      if (!entry || entry.kind === 'finder') return 'Finder';
      if (entry.kind === 'messages') return 'Messages';
      if (entry.kind === 'about') return 'Katie OS';
      const type = entry.node.type;
      if (type === 'image' || type === 'pdf') return 'Preview';
      if (type === 'video') return 'QuickTime Player';
      if (type === 'audio') return 'Music';
      return 'TextEdit';
    }

    function updateMenubar() {
      appTitle.textContent = appNameFor(activeEntry());
    }

    /* ---------- menus ---------- */
    // each menu is a list of items: { label, action, shortcut, disabled, checked } or '-'
    const MENUS = {
      system: () => [
        { label: `About ${ABOUT.name || 'Katie OS'}`, action: openAbout },
        '-',
        { label: 'Sign the Guestbook…', action: openMessages },
        { label: 'Ask the Croissant…', action: () => document.querySelector('.pet-prompt input')?.focus() },
        '-',
        { label: 'Restart…', action: () => location.reload() },
      ],
      app: () => {
        const entry = activeEntry();
        return [
          { label: `About ${appNameFor(entry)}`, action: openAbout },
          '-',
          { label: 'Empty Trash…', action: emptyTrash, disabled: TRASH.children.length === 0 },
          '-',
          { label: `Quit ${appNameFor(entry)}`, shortcut: '⌘Q', action: () => entry && close(entry), disabled: !entry },
        ];
      },
      file: () => {
        const entry = activeEntry();
        return [
          { label: 'New Finder Window', shortcut: '⌘N', action: () => openFinder(ROOT) },
          { label: 'Open Messages', action: openMessages },
          '-',
          { label: 'Close Window', shortcut: '⌘W', action: () => close(entry), disabled: !entry },
          '-',
          { label: 'Empty Trash…', shortcut: '⇧⌘⌫', action: emptyTrash, disabled: TRASH.children.length === 0 },
        ];
      },
      view: () => {
        const entry = activeEntry();
        const finder = entry && entry.kind === 'finder' ? entry : null;
        const setView = view => () => {
          finder.view = view;
          renderFinder(finder);
        };
        return [
          { label: 'as Icons', shortcut: '⌘1', action: setView('icons'), disabled: !finder, checked: finder?.view === 'icons' },
          { label: 'as List', shortcut: '⌘2', action: setView('list'), disabled: !finder, checked: finder?.view === 'list' },
        ];
      },
      go: () => {
        const entry = activeEntry();
        const finder = entry && entry.kind === 'finder' ? entry : null;
        // like Finder: go there in the front window, or open one
        const goTo = folder => () => finder ? navigate(finder, folder) : showFolder(folder);
        return [
          { label: 'Back', shortcut: '⌘[', action: () => go(finder, -1), disabled: !finder || finder.at === 0 },
          { label: 'Forward', shortcut: '⌘]', action: () => go(finder, 1), disabled: !finder || finder.at === finder.history.length - 1 },
          '-',
          { label: ROOT.name, action: goTo(ROOT) },
          ...ROOT.children.filter(n => n.type === 'directory').map(n => ({ label: n.name, action: goTo(n) })),
          '-',
          { label: 'Trash', action: goTo(TRASH) },
        ];
      },
      window: () => {
        const entry = activeEntry();
        const all = [...windows];
        return [
          { label: 'Minimize', shortcut: '⌘M', action: () => minimize(entry), disabled: !entry || entry.kind === 'about' },
          { label: 'Zoom', action: () => zoom(entry), disabled: !entry || entry.kind === 'about' },
          ...(all.length ? ['-'] : []),
          ...all.map(w => ({
            label: w.win.getAttribute('aria-label'),
            checked: w === entry,
            action: () => bringBack(w),
          })),
        ];
      },
      help: () => [
        // the croissant handles support, reluctantly
        { label: `${ABOUT.name || 'Katie OS'} Help`, action: () => window.dispatchEvent(new CustomEvent('pet-say', { detail: 'help yourself. or throw me, i guess.' })) },
        { label: 'Leave Feedback…', action: openMessages },
      ],
    };

    function showMenu(title) {
      hideMenu();
      const dropdown = el('div', 'menu-dropdown');
      dropdown.setAttribute('role', 'menu');
      MENUS[title.dataset.menu]().forEach(item => {
        if (item === '-') {
          dropdown.append(el('div', 'menu-separator'));
          return;
        }
        const row = el('button', 'menu-item' + (item.checked ? ' checked' : ''));
        row.type = 'button';
        row.setAttribute('role', 'menuitem');
        row.disabled = Boolean(item.disabled);
        const label = el('span', 'menu-label');
        label.textContent = item.label;
        row.append(label);
        if (item.shortcut) {
          const shortcut = el('span', 'menu-shortcut');
          shortcut.textContent = item.shortcut;
          row.append(shortcut);
        }
        row.addEventListener('click', () => {
          hideMenu();
          item.action();
        });
        dropdown.append(row);
      });
      const rect = title.getBoundingClientRect();
      dropdown.style.left = Math.min(rect.left, window.innerWidth - 240) + 'px';
      dropdown.style.top = MENUBAR_HEIGHT + 'px';
      document.body.append(dropdown);
      title.classList.add('open');
      openMenu = { title, dropdown };
    }

    function hideMenu() {
      if (openMenu) {
        openMenu.title.classList.remove('open');
        openMenu.dropdown.remove();
        openMenu = null;
      }
    }

    menubar.querySelectorAll('.menu-title').forEach(title => {
      // click to open; once a menu is open, hovering the others switches to them
      title.addEventListener('pointerdown', e => {
        e.preventDefault();
        e.stopPropagation();
        openMenu?.title === title ? hideMenu() : showMenu(title);
      });
      title.addEventListener('pointerenter', () => {
        if (openMenu && openMenu.title !== title) {
          showMenu(title);
        }
      });
    });
    document.addEventListener('pointerdown', e => {
      if (openMenu && !e.target.closest('.menu-dropdown, .menubar')) {
        hideMenu();
      }
    }, true);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        hideMenu();
      }
    });

    /* ---------- about this computer ---------- */
    function openAbout() {
      const existing = [...windows].find(w => w.kind === 'about');
      if (existing) {
        bringBack(existing);
        return;
      }
      const entry = { kind: 'about', tile: () => ({ node: { name: ABOUT.name || 'Katie OS' }, appIcon: CLOUD_ICON }) };
      const win = makeWindow('window-about', 300, 440,
        `<div class="titlebar drag-region">${LIGHTS}<div class="title"></div></div>` +
        `<div class="content about"><div class="about-logo">${CLOUD_ICON}</div>` +
        '<div class="about-name"></div><div class="about-version"></div><p class="about-blurb"></p>' +
        '<dl class="about-specs"></dl>' +
        '<button class="about-more" type="button">Sign the Guestbook…</button></div>', entry);
      win.setAttribute('aria-label', `About ${ABOUT.name || 'Katie OS'}`);
      win.querySelector('.about-name').textContent = ABOUT.name || 'Katie OS';
      win.querySelector('.about-version').textContent = ABOUT.version || '';
      win.querySelector('.about-blurb').textContent = ABOUT.blurb || '';
      const specs = win.querySelector('.about-specs');
      (ABOUT.specs || []).forEach(([label, value]) => {
        const row = el('div');
        const dt = el('dt');
        dt.textContent = label;
        const dd = el('dd');
        dd.textContent = value;
        row.append(dt, dd);
        specs.append(row);
      });
      win.querySelector('.about-more').addEventListener('click', openMessages);
      // fit the window to however much text the config has
      win.style.height = 'auto';
      win.style.height = win.offsetHeight + 'px';
      // like the real one, it can't be minimized or zoomed
      win.querySelectorAll('.minimize, .zoom').forEach(b => { b.disabled = true; });
    }

    /* ---------- clock ---------- */
    // "Wed Oct 1  12:45 PM", in Katie's time zone (Central)
    function tickClock() {
      const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
        timeZone: CONFIG.clockTimeZone || 'America/Chicago',
        weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true,
      }).formatToParts(new Date()).map(p => [p.type, p.value]));
      clock.textContent = `${parts.weekday} ${parts.month} ${parts.day}  ${parts.hour}:${parts.minute} ${parts.dayPeriod}`;
      clock.title = 'Central Time (St. Louis)';
    }

    /* ================= desktop + dock ================= */
    const plantbed = document.querySelector('.plantbed');
    const desktopItems = new Map(); // node -> .item wrapper on the desktop
    const pendingDesktopSpot = new Map(); // node -> [x, y] where it was dropped
    let autoSpot = 0;

    // locally (file://) folder links need index.html spelled out
    if (location.protocol === 'file:') {
      document.querySelectorAll('.pathbar a').forEach(a => {
        a.setAttribute('href', a.getAttribute('href').replace(/\/?$/, '/') + 'index.html');
      });
    }

    function wireDesktopIcon(icon, node) {
      icon.node = node;
      icon.addEventListener('click', deactivateWindows);
      wireIcon(icon, () => open(node));
      makeDraggable(icon, node);
    }

    plantbed.querySelectorAll('[data-index]').forEach(item => {
      const node = ROOT.children[+item.dataset.index];
      desktopItems.set(node, item.closest('.item'));
      if (item.classList.contains('file')) {
        wireDesktopIcon(item, node);
      }
    });
    // switch the desktop to free positioning, so icons can be dragged anywhere
    function freezeDesktop() {
      if (plantbed.classList.contains('frozen')) {
        return;
      }
      const base = plantbed.getBoundingClientRect();
      const spots = [...plantbed.children].map(item => {
        const rect = item.getBoundingClientRect();
        return [item, rect.left - base.left, rect.top - base.top];
      });
      plantbed.style.height = plantbed.offsetHeight + 'px';
      plantbed.classList.add('frozen');
      spots.forEach(([item, x, y]) => {
        item.style.left = x + 'px';
        item.style.top = y + 'px';
      });
    }

    // put a desktop icon's top-left corner at viewport point (x, y)
    function placeOnDesktop(node, x, y) {
      freezeDesktop();
      const base = plantbed.getBoundingClientRect();
      const item = desktopItems.get(node);
      item.style.left = x - base.left + 'px';
      item.style.top = y - base.top + 'px';
    }

    // add or remove desktop icons to match what's in ROOT
    function syncDesktop() {
      desktopItems.forEach((item, node) => {
        if (parentOf.get(node) !== ROOT) {
          if (selected && item.contains(selected)) {
            select(null);
          }
          item.remove();
          desktopItems.delete(node);
        }
      });
      ROOT.children.forEach(node => {
        if (desktopItems.has(node)) {
          return;
        }
        freezeDesktop();
        const item = el('div', 'item');
        const icon = iconFor(node);
        item.append(icon);
        wireDesktopIcon(icon, node);
        plantbed.append(item);
        desktopItems.set(node, item);
        // dropped on the desktop: land there. otherwise stack down the right edge
        const [x, y] = pendingDesktopSpot.get(node) || [window.innerWidth - 130, 230 + (autoSpot++ % 5) * 100];
        pendingDesktopSpot.delete(node);
        placeOnDesktop(node, x, y);
      });
    }

    // clicking empty desktop clears the selection
    document.querySelector('main').addEventListener('pointerdown', e => {
      if (!e.target.closest('.file, .pathbar')) {
        select(null);
        deactivateWindows();
      }
    });

    /* ---------- dock apps ---------- */
    function bounce(item) {
      item.querySelector('.dock-icon').animate([
        { transform: 'translateY(0)' },
        { transform: 'translateY(-22px)', offset: .25 },
        { transform: 'translateY(0)', offset: .5 },
        { transform: 'translateY(-10px)', offset: .7 },
        { transform: 'translateY(0)' },
      ], { duration: 750, easing: 'ease-in-out' });
    }

    // Finder is always running: bring its windows forward, un-minimize one,
    // or open a new window if there are none
    dock.querySelector('.dock-finder').addEventListener('click', () => {
      const finders = [...windows].filter(w => w.kind === 'finder');
      const visible = finders.filter(w => !w.mini).sort((a, b) => a.win.style.zIndex - b.win.style.zIndex);
      if (visible.length) {
        visible.forEach(w => focus(w.win));
      } else if (finders.length) {
        restore(finders.at(-1));
      } else {
        openFinder(ROOT);
      }
    });

    dock.querySelector('.dock-messages').addEventListener('click', e => {
      if (![...windows].some(w => w.kind === 'messages')) {
        bounce(e.currentTarget);
      }
      openMessages();
    });

    dock.querySelector('.dock-music').addEventListener('click', e => {
      bounce(e.currentTarget);
      window.open(CONFIG.musicUrl, '_blank', 'noopener');
    });

    trash.addEventListener('click', () => showFolder(TRASH));

    /* ---------- dock magnification ---------- */
    let mouseX = null;
    let animating = false;

    function step() {
      let moving = false;
      dock.querySelectorAll('.dock-item').forEach(item => {
        const rect = item.getBoundingClientRect();
        const center = rect.left + rect.width / 2;
        const target = mouseX === null
          ? DOCK_BASE
          : DOCK_BASE + (DOCK_MAX - DOCK_BASE) * Math.exp(-((mouseX - center) ** 2) / (2 * DOCK_SPREAD ** 2));
        const current = parseFloat(item.style.getPropertyValue('--size')) || DOCK_BASE;
        const next = current + (target - current) * .35;
        if (Math.abs(target - next) > .2) {
          moving = true;
        }
        item.style.setProperty('--size', (moving ? next : target) + 'px');
      });
      animating = moving;
      if (moving) {
        requestAnimationFrame(step);
      }
    }
    function kick() {
      if (!animating) {
        animating = true;
        requestAnimationFrame(step);
      }
    }
    dock.addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse') {
        mouseX = e.clientX;
        kick();
      }
    });
    dock.addEventListener('pointerleave', () => {
      mouseX = null;
      kick();
    });

    updateWeather();
    setInterval(updateWeather, WEATHER_REFRESH_MS);
    tickClock();
    setInterval(tickClock, 10000);
    updateMenubar();

  })();
  </script>
